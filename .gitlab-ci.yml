include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.latest.gitlab-ci.yml

stages:
  - validate
  - test
  - sast
  - build
  - security

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_TLS_CERTDIR: "/certs"
  TRIVY_NO_PROGRESS: "true"

cache:
  paths:
    - .cache/pip

validate:
  stage: validate
  image: python:3.12
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -e .
    - pip install pytest ruff
  script:
    - python -m compileall src

lint:
  stage: validate
  image: python:3.12
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -e .
    - pip install pytest ruff
  script:
    - ruff check src tests

test:
  stage: test
  image: python:3.12
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -e .
    - pip install pytest ruff
  script:
    - pytest -v

docker_build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - test "$(docker inspect "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" --format '{{.Config.User}}')" = "myvcs"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

trivy_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  before_script:
    - trivy registry login --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 0 "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
