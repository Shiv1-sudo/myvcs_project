application:
  name: "myvcs"
  version: "0.1.0"

repository:
  metadata_directory: ".myvcs"
  objects_directory: "objects"
  references_directory: "refs"
  heads_directory: "heads"
  tags_directory: "tags"
  remotes_directory: "remotes"
  index_file: "index"
  head_file: "HEAD"
  repository_config_file: "config"

objects:
  hash_algorithm: "sha256"
  blob_type: "blob"
  tree_type: "tree"
  commit_type: "commit"

references:
  head_prefix: "ref: "
  heads_reference_prefix: "refs/heads/"
  tags_reference_prefix: "refs/tags/"
  remotes_reference_prefix: "refs/remotes/"
  default_branch: "main"

index:
  version: 1

commit:
  default_author: "MyVCS User"
  default_message: "No commit message provided"

cli:
  success_exit_code: 0
  error_exit_code: 1

logging:
  level: "DEBUG"
  directory: "logs"
  filename: "myvcs.log"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

merge:
  default_message: "Merge commit"
  conflict_marker_start: "<<<<<<< "
  conflict_marker_separator: "======="
  conflict_marker_end: ">>>>>>> "

gc:
  grace_period_days: 30

pack:
  directory: "pack"
  extension: ".pack"
  index_extension: ".idx"
  default_name: "pack-001"
  version: 1

remote:
  default_name: "origin"

diff:
  context_lines: 3