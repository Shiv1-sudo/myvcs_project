apiVersion: apps/v1
kind: Deployment

metadata:
  name: myvcs
  labels:
    app.kubernetes.io/name: myvcs
    app.kubernetes.io/component: application

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: myvcs
      app.kubernetes.io/component: application

  template:
    metadata:
      labels:
        app.kubernetes.io/name: myvcs
        app.kubernetes.io/component: application

    spec:
      serviceAccountName: myvcs
      automountServiceAccountToken: false

      imagePullSecrets:
        - name: gitlab-registry

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: myvcs
          image: myvcs
          imagePullPolicy: Always

          workingDir: /workspace

          command:
            - /bin/sh
            - -c

          args:
            - |
              while true; do
                sleep 3600
              done

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          volumeMounts:
            - name: repository-data
              mountPath: /workspace

      volumes:
        - name: repository-data
          persistentVolumeClaim:
            claimName: myvcs-repository