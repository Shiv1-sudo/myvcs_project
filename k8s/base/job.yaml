apiVersion: batch/v1
kind: Job
metadata:
  name: myvcs-help
  labels:
    app.kubernetes.io/name: myvcs
    app.kubernetes.io/component: cli-job
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300

  template:
    metadata:
      labels:
        app.kubernetes.io/name: myvcs
        app.kubernetes.io/component: cli-job

    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: gitlab-registry

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: myvcs
          image: myvcs
          imagePullPolicy: IfNotPresent

          command:
            - myvcs

          args:
            - --help

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
